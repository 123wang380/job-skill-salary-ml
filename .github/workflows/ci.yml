name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Train baseline
        run: >-
          python -m job_ml.pipeline
          --data data/raw/sample_jobs.csv
          --output-dir .ci-artifacts
          --no-lightgbm
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: baseline-metrics
          path: .ci-artifacts/metrics.json
